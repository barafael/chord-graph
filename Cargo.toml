[workspace]
resolver = "3"
members = ["crates/graph", "crates/api", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
api = { path = "crates/api" }

[profile.release]
opt-level = 3
codegen-units = 16

# Size-optimised wasm for deployment (`trunk build --release --cargo-profile dist`).
[profile.dist]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
