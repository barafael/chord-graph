[package]
name = "app"
description = "The chord-graph browser app (Leptos, client-side)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
api.workspace = true
serde_json.workspace = true
leptos = { version = "0.8", features = ["csr"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Location", "History", "Response",
    "AudioContext", "AudioContextState", "BaseAudioContext", "AudioNode", "AudioDestinationNode", "AudioParam",
    "AudioScheduledSourceNode", "OscillatorNode", "OscillatorType", "GainNode", "BiquadFilterNode", "BiquadFilterType",
] }
